[project]
name = "Labs"
version = "0.1.0"
description = "A collection of university lab projects"
readme = "README.md"
dependencies = [
    "cryptography>=46.0.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pip>=25.3",
    "seaborn>=0.13.2",
    "pyarrow>=23.0.1",
    "streamlit>=1.51.0",
    "pyzmq>=27.1.0",
    "notebook>=7.5.4",
]
requires-python = "==3.13.*"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["**.py"]
exclude = [
    "**/.*",
    "**/site-packages/**",
    "**/.venv/**",
    "**/node_modules/**",
    "**/__pycache__/**"
]
