[project]
name = "Labs"
version = "0.1.0"
description = "A collection of university lab projects"
readme = "README.md"
dependencies = [
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "seaborn>=0.13.2",
]
requires-python = ">=3.12"

[tool.pyright]
include = ["**.py"]
exclude = [
    "**/site-packages/**",
    "**/.venv/**",
    "**/node_modules/**",
    "**/__pycache__/**"
]
